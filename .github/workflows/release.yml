name: Release

on:
  issue_comment:
    types: [created, deleted]
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Context check
    outputs:
      continue: ${{ steps.check.outputs.continue }}
      workflow: ${{ steps.check.outputs.workflow }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Context check
        id: check
        uses: TrigenSoftware/simple-release-action@709ea3e785fd030c13a5e7959c18a51d57da1254 # v2.0.9
        with:
          workflow: check
          github-token: ${{ github.token }}
          branch: release
  pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Pull request
    needs: check
    if: needs.check.outputs.workflow == 'pull-request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create or update pull request
        uses: TrigenSoftware/simple-release-action@709ea3e785fd030c13a5e7959c18a51d57da1254 # v2.0.9
        with:
          workflow: pull-request
          github-token: ${{ github.token }}
          branch: release
      - name: Run CI and set status checks on release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/release --jq '.object.sha' 2>/dev/null) || true
          if [ -z "$HEAD_SHA" ]; then
            echo "No release branch found — nothing to verify."
            exit 0
          fi

          gh workflow run ci.yml --ref release
          sleep 5
          RUN_ID=$(gh run list --branch release --workflow ci.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Waiting for CI run $RUN_ID..."
          gh run watch "$RUN_ID" --exit-status && STATUS=success || STATUS=failure

          for context in "Lint, Format & Typecheck" "Test (Bun 1.3.3)" "Test (Bun latest)"; do
            gh api repos/${{ github.repository }}/statuses/$HEAD_SHA \
              -f state="$STATUS" \
              -f context="$context" \
              -f description="CI $STATUS" \
              --silent
          done
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Release
    needs: check
    if: needs.check.outputs.workflow == 'release'
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate
        run: bun run check && bun test
      - name: Release
        uses: TrigenSoftware/simple-release-action@709ea3e785fd030c13a5e7959c18a51d57da1254 # v2.0.9
        with:
          workflow: release
          github-token: ${{ github.token }}
          branch: release
        env:
          NPM_CONFIG_PROVENANCE: "true"
